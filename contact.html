<!--Boilerplate setting foundational info.-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact.css">
    <title>Contacts</title>
</head>

<body>
    <main>
        <!--div element with the class name of "mainForm" first contains an h1 element and p element which talk about the form. -->
        <div class="mainForm">
            <h1>Interest Form</h1>
            <p>Please fill out this form if you are interested in contacting me!</p>
            <!--The form element is a container used to wrap elements that take in user input-->
            <form>
                <!--fieldset is a "subcontainer" of related input within the larger wrapping form element-->
                <fieldset>
                    <!--Legend wraps everything in the fieldset with a border and in this case the title of "Your Data"-->
                    <legend>Your Data</legend>
                    <!--This means there is an element called label with the attribute "for" that has a value which corresponds 
                    to the input with the id of "name", and that label has the text of Enter your fullname-->
                    <!--The input element creates a text box where people can enter data.-->
                    <label for="first-name">Enter Your Full Name: <input id="name"></label>
                    <!--Skip line-->
                    <br>
                    <!--These labels + inputs now ask for an email and phone number-->
                    <label for="last-name">Enter Your Email: <input id="last-name"></label>
                    <br>
                    <label for="email">Enter Your Phone Number:<input id="phone"></label>
                </fieldset>
                <!--Multiple line breaks-->
                <br>
                <br>
                <br>
                <!--New subcontainer now regarding radio buttons (the user can only choose one option from all buttons) -->
                <fieldset>
                    <legend>Contact Preference</legend>
                    <!--This time, the input elements are given an id, a type (in this case radio buttons), and a name (so all 
                    radio buttons can be grouped into one major group))-->
                    <input id="phone" type="radio" name="contact">
                <!--Labels still give text to the input element that has the same id value as the label's for value.-->
                    <label for="phone">Phone</label>
                    <input id="email" type="radio" name="contact">
                    <label for="email">Email</label>
                    <input id="both" type="radio" name="contact">
                    <label for="both">Both</label>
                </fieldset>
                <!--Multiple line breaks-->
                <br>
                <br>
                <br>
                <!--New subcontainer now regarding a dropdown menu that the user can choose one option from-->
                <fieldset>
                    <legend>Experience</legend>
                    <!--Label element giving some text to the select element with the id of "experience"-->
                    <label for="experience">How would you rate the website functionality?</label>

                    <!--The select element has an id (so it can link with a label) and different option elements.
                    These option elements relate to the different drop down options in the dropdown menu. Their 
                    value attribute will be used for the program to know exactly what option the user clicked 
                    while the text outside is just what the user can see. -->
                    <select id="experience">
                        <option value="Poor">Poor</option>
                        <option value="Satisfactory">Satisfactory</option>
                        <option value="AboveAverage">Above Average</option>
                        <option value="Incredible">Incredible</option>
                    </select>
                </fieldset>
                <br>
                <br>

                <!--Label with the for attribute of "comments" links to the textarea (big text box) element with the id of comments-->
                <label for="comments">What are your interest(s)/concern(s) you would like to tell me?</label>
                <br>
                <!--The textareas cols and rows defines wide and tall the element is. Here, the name attribute is used for backend
                purposes (when the user actually submits something). But in this case, our form submit button doesnt work. -->
                <textarea cols="50" rows="5" name="comments" id="comments"></textarea>
                <br>
                <br>
                <!--Button with the id of "button" and text of Submit-->
                <button id="button">Submit</button>
            </form>
        </div>
    </main>

    
 <!--This section has the class of "navbar" and includes elements related to navigating the whole webpage.-->
    <section class="navbar">
        <!--Anchored within a <p> element are multiple anchor elements which contain the attribute href 
            and its specific values corresponding to different links of the web page. This helps the user 
            navigate between different tabs of the website.-->
        <p><a href="index.html"> | Home </a>| |<a href="music.html">Music Portfolio</a>| |<a
                href="contact.html">Contacts</a>|</p>
    </section>




</body>

</html>
